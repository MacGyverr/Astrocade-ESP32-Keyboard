[platformio]
default_envs = Astrocade-Keyboard-esp32-s3-usb-ble-wifi

[env]
platform = platformio/espressif32@7.1.3
board = rymcu-esp32-s3-devkitc-1
framework = espidf
extra_scripts = pre:tools/build_version.py
; Stock ESP-IDF libraries are downloaded from src/idf_component.yml.
; dependencies*.lock pin target versions; managed_components is generated.
; Do not duplicate these components in lib_deps.

; Target module: ESP32-S3-WROOM-1-N8R2, 8 MB Quad flash + 2 MB Quad PSRAM.
; The native USB-C/OTG connector uses GPIO19/GPIO20.
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = partitions_8mb.csv
board_build.embed_files =
    web/index.html
    web/app.js
    web/style.css
build_flags =
    '-DASTROCADE_FIRMWARE_VERSION="1.0.0"'
    -DASTROCADE_WEB_ENABLED=1
    -DASTROCADE_TEXT_LINE_GAP_MS=100
    -DASTROCADE_SERIAL_DEBUG_ENABLED=1
    -DASTROCADE_CROSSPOINT_DEBUG_ENABLED=1
    -DASTROCADE_CROSSPOINT_SETUP_DELAY_US=1
    -DASTROCADE_CROSSPOINT_STROBE_LOW_US=1
    -DASTROCADE_CROSSPOINT_RECOVERY_DELAY_US=1
    -DASTROCADE_KEYPRESS_DOWN_MS=15
    -DASTROCADE_KEYPRESS_GAP_MS=5
    -DASTROCADE_BACKSPACE_LEFT_ERASE_ENABLED=1
    -DASTROCADE_USB_CAPS_LOCK_LED_DEFAULT_ON=1
    -DASTROCADE_USB_NUM_LOCK_LED_DEFAULT_ON=1
    -DASTROCADE_USB_NUM_LOCK_TOGGLE_ENABLED=1
    -DASTROCADE_USB_CAPS_LOCK_TOGGLE_ENABLED=1
    -DASTROCADE_BLE_CAPS_LOCK_LED_DEFAULT_ON=1
    -DASTROCADE_BLE_NUM_LOCK_LED_DEFAULT_ON=1
    -DASTROCADE_BLE_NUM_LOCK_TOGGLE_ENABLED=1
    -DASTROCADE_BLE_CAPS_LOCK_TOGGLE_ENABLED=1
    -DASTROCADE_BLE_ENROLLMENT_WINDOW_SECONDS=10
    -DASTROCADE_BLE_REQUIRE_MITM=1
    -DASTROCADE_BLE_RESET_BUTTON_ENABLED=1
    -DASTROCADE_BLE_RESET_BUTTON_GPIO=0
    -DASTROCADE_BLE_RESET_BUTTON_HOLD_MS=3000
    -DASTROCADE_BLE_RECONNECT_SCAN_ENABLED=1
    -DASTROCADE_BLE_RECONNECT_SCAN_SECONDS=5
    -DASTROCADE_BLE_RECONNECT_DELAY_MS=100
    -DASTROCADE_BLE_VERBOSE_DEBUG_ENABLED=0

upload_protocol = esptool

; Debug output is on the CH343 USB-to-serial COM port, not native USB OTG.
monitor_speed = 115200

[env:Astrocade-Keyboard-esp32-s3-usb-ble-wifi]
; Use ESP32-S3-WROOM-1-N8R2: 8 MB Quad flash, 2 MB Quad PSRAM.
build_flags =
    ${env.build_flags}
    ${s3.build_flags}
    -DASTROCADE_USB_ENABLED=1

[env:Astrocade-Keyboard-esp32-s3-ble-wifi]
build_flags =
    ${env.build_flags}
    ${s3.build_flags}
    -DASTROCADE_USB_ENABLED=0

[s3]
; Both S3 profiles above explicitly target N8R2 hardware with RGB on GPIO48.
; Shared revised S3 GPIO map. Edit GPIO numbers, not physical header positions.
build_flags =
    -DASTROCADE_BOARD_N8R2=1
    -DASTROCADE_TEXT_MAX_BYTES=262144
    -DASTROCADE_TEXT_USE_PSRAM=1
    -DASTROCADE_STATUS_LED_ENABLED=1
    -DASTROCADE_CROSSPOINT_A0_GPIO=15
    -DASTROCADE_CROSSPOINT_A1_GPIO=7
    -DASTROCADE_CROSSPOINT_A2_GPIO=6
    -DASTROCADE_CROSSPOINT_A3_GPIO=5
    -DASTROCADE_CROSSPOINT_A4_GPIO=4
    -DASTROCADE_CROSSPOINT_A5_GPIO=16
    -DASTROCADE_CROSSPOINT_DATA_GPIO=17
    -DASTROCADE_CROSSPOINT_STROBE_GPIO=18

[env:Astrocade-Keyboard-esp32-4mb-ble-wifi]
; Classic ESP32-WROOM-32 family, 4 MB flash, no PSRAM; user-tested boards.
; This is NOT the S3 pin map. Verify your board before wiring.
board = esp32dev
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = partitions_4mb.csv
build_flags =
    ${env.build_flags}
    -DASTROCADE_CLASSIC_ESP32=1
    -DASTROCADE_USB_ENABLED=0
    -DASTROCADE_STATUS_LED_ENABLED=0
    -DASTROCADE_TEXT_MAX_BYTES=8192
    -DASTROCADE_TEXT_USE_PSRAM=0
    -DASTROCADE_CROSSPOINT_A0_GPIO=18
    -DASTROCADE_CROSSPOINT_A1_GPIO=19
    -DASTROCADE_CROSSPOINT_A2_GPIO=21
    -DASTROCADE_CROSSPOINT_A3_GPIO=22
    -DASTROCADE_CROSSPOINT_A4_GPIO=23
    -DASTROCADE_CROSSPOINT_A5_GPIO=25
    -DASTROCADE_CROSSPOINT_DATA_GPIO=26
    -DASTROCADE_CROSSPOINT_STROBE_GPIO=27
